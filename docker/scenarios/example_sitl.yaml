# Example is consumable by the standalone sensing builder, not flight-ready.
# Vehicle transforms and altitude are placeholders requiring measured registration.
schema_version: 1
scenario_id: sitl_three_drone_example
map:
  frame_id: map
  axes: north_east
  origin_m: [0.0, 0.0]
  resolution_m: 1.0
  shape_rows_columns: [51, 51]
  row_direction: east
  obstacles:
    kind: circles
    circles:
      - center_m: [25.0, 25.0]
        radius_m: 3.0
field:
  kind: gaussian_mixture
  seed: 123
  components:
    - center_m: [15.0, 15.0]
      sigma_m: 5.0
      amplitude: 1.0
    - center_m: [37.0, 35.0]
      sigma_m: 4.0
      amplitude: 0.7
  low_smoothing_sigma_cells: 4.0
  truth_rho: 0.8
vehicles:
  - id: uav_1
    namespace: /uav_1
    role: ground
    altitude_m: 3.0
    map_from_local_ned_xy: null # Must be measured before use.
    sensor:
      fidelity: high
      type: cone
      range_m: 5.0
      fov_degrees: 90.0
      period_s: 0.5
      sample_count: 3
      noise_variance: 0.0001
      seed: 101
  - id: uav_2
    namespace: /uav_2
    role: ground
    altitude_m: 3.0
    map_from_local_ned_xy: null
    sensor:
      fidelity: high
      type: cone
      range_m: 5.0
      fov_degrees: 90.0
      period_s: 0.5
      sample_count: 3
      noise_variance: 0.0001
      seed: 102
  - id: uav_3
    namespace: /uav_3
    role: aerial
    altitude_m: 10.0
    map_from_local_ned_xy: null
    sensor:
      fidelity: low
      type: footprint
      radius_m: 10.0
      occlusion: false
      period_s: 0.5
      sample_count: 3
      noise_variance: 0.04
      seed: 103
estimator:
  rho: 0.8
  update_period_s: 1.0
  jitter: 1.0e-8
  low_kernel: {length_scale_m: 5.0, variance: 1.0}
  discrepancy_kernel: {length_scale_m: 1.5, variance: 0.25}
  retention: {max_low_samples: 250, max_high_samples: 250}
control:
  command_stream_hz: 20.0
  # Clearance, plan expiry, and dynamics limits must be selected before execution.
  obstacle_clearance_m: null
  plan_expiry_s: null
time:
  clock_domain: null # Select and verify before execution.
  max_pose_age_s: null
  max_observation_age_s: null
