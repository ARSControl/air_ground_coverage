# Publication protocol for closed-loop HIGH-field reconstruction versus team
# composition. The runner overrides the two placeholder team sizes and splits
# the fixed retained-sample budget in proportion to each A/G composition.
estimator_mode: multifidelity

simulation:
  num_steps: 200
  dt: 0.1
  random_seed: 42
  num_episodes: 30

initialization:
  position_policy: corner
  corner: lower_left
  corner_fraction: 0.2

composition_sweep:
  total_robots: 10
  aerial_counts: [10, 2, 0]
  total_retained_samples: 400
  default_scenario: easy_long
  scenarios:
    easy_long:
      num_steps: 200
      num_obstacles: 5
      obstacles_radius: 1.0
    hard_short:
      num_steps: 100
      num_obstacles: 15
      obstacles_radius: 2.0

map:
  size: [50, 50]
  resolution: 1.0

goal_density:
  type: gaussian_mixture
  num_peaks: 2

heat_equation:
  alpha: 1.0
  source_strength: 1.0
  beta: 0.1
  local_cooling: 0.1
  cfl_safety: 1.0

visualization:
  save_video: true
  save_final_plot: true
  gp_debug: false

output:
  save_results: true
  verbose: true
  print_frequency: 100

multifidelity:
  rho: 0.8
  discrepancy_enabled: true
  gp_update_period: 1.0
  aerial_sensor_period: 0.5
  ground_sensor_period: 0.5
  low_kernel:
    length_scale: 5.0
    variance: 1.0
  discrepancy_kernel:
    length_scale: 4.0
    variance: 0.25
  low_noise_variance: 0.04
  high_noise_variance: 0.001
  jitter: 1.0e-8
  max_jitter_attempts: 5
  jitter_multiplier: 10.0
  retention:
    max_low_samples: 400
    max_high_samples: 400
    min_low_separation: 0.25
    min_high_separation: 0.10
    take_threshold: null
  aerial_target:
    source: high_posterior
    lambda_interest: 1.0
    lambda_uncertainty: 0.25
  density:
    normalization_tolerance: 1.0e-8
  sensor:
    low_fidelity_smoothing_sigma_cells: 2.0
    random_seed_offset: 10000
  hyperparameter_optimization:
    enabled: true
    fit_interval_updates: 5
    min_samples: 40
    num_restarts: 1
    max_iterations: 75
    bounds:
      low_length_scale: [1.0, 20.0]
      low_variance: [0.05, 5.0]
      discrepancy_length_scale: [3.0, 10.0]
      discrepancy_variance: [0.01, 2.0]

aerial:
  ergodic_control:
    mode: decentralized
    neighbor_weighting: hard
  simulation:
    num_agents: 4
  agents:
    model_type: dubins
    max_velocity: 5.0
    max_acceleration: 0.5
    max_angular_velocity: 0.785
    max_angular_acceleration: 0.393
    dt_agent: 0.1
    agent_radius: 10.0
    min_kernel_val: 0.000001
    wall_avoidance_weight: 1.0
    dubins:
      forward_speed: 10.0
      max_bank_angle: 60.0
  sensor:
    fov_degrees: 360.0
    fov_depth: 10.0
  multi_agent:
    sensing_range: 10.0
    min_safe_distance: 1.0
  gpr:
    sigma_f: 1.0
    length_scale: 1.0
    noise_level: 0.2
    gamma: 0
    obs_noise_std: 0.2
    obs_per_step: 10
    min_samples: 10
    use_filter: false
    take_threshold: 0.15
    remove_threshold: -1
    max_dataset_size: 400
    fit_hyperparams: false
    fit_interval: 10

ground:
  controller:
    type: lloyd
  simulation:
    num_agents: 4
    num_obstacles: 5
    obstacles_radius: 1.0
  agents:
    model_type: unicycle
    max_velocity: 2.0
    max_acceleration: 2.5
    max_angular_velocity: 5.0
    max_angular_acceleration: 3.0
    dt_agent: 0.1
    agent_radius: 5.0
    min_kernel_val: 0.000001
    wall_avoidance_weight: 1.0
  sensor:
    fov_degrees: 90.0
    fov_depth: 5.0
  multi_agent:
    sensing_range: 10.0
    min_safe_distance: 1.0
  gpr:
    sigma_f: 1.0
    length_scale: 1.0
    noise_level: 0.01
    gamma: 0
    obs_noise_std: 0.01
    obs_per_step: 10
    min_samples: 10
    use_filter: false
    take_threshold: 0.15
    remove_threshold: -1
    max_dataset_size: 400
    fit_hyperparams: false
    fit_interval: 10
  map:
    resolution: 0.1
    local_grid_points: 100
  mpc:
    horizon: 3
    max_iterations: 300
    print_time: false
    tolerance: 1.0e-4
  lloyd:
    position_gain: 1.0
    heading_gain: 2.0
    centroid_tolerance: 0.05
    max_linear_velocity: 4.0
    max_angular_velocity: 5.0
