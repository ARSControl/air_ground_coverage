# Example: Complex Map with Obstacles
# This example shows how to use an existing map file

simulation:
  num_steps: 2000
  num_agents: 4
  dt: 0.1
  random_seed: 42

heat_equation:
  alpha: 0.15
  source_strength: 1.0
  beta: 0.01
  local_cooling: 0.1

agents:
  max_velocity: 1.5
  max_acceleration: 0.5
  max_angular_velocity: 0.785
  max_angular_acceleration: 0.393
  dt_agent: 0.1
  agent_radius: 0.5
  min_kernel_val: 0.01

sensor:
  fov_degrees: 90.0
  fov_depth: 5.0

multi_agent:
  sensing_range: 15.0
  min_safe_distance: 1.0

map:
  # Load from existing map file
  path: "../../example_maps/simpleMap_05.npy"
  # Resolution will be automatically determined from map dimensions
  
goal_density:
  type: "gaussian_mixture"
  num_peaks: 4

visualization:
  plot_frequency: 50
  save_video: true
  video_fps: 30
  video_path: "output/hedac_complex_map.mp4"

output:
  save_results: true
  results_path: "output/results_complex.npz"
  verbose: true
  print_frequency: 100
