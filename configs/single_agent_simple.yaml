# Example: Single Agent on Obstacle-Free Map
# Minimal configuration for quick testing

simulation:
  num_steps: 500
  num_agents: 1
  dt: 0.1
  random_seed: 123

heat_equation:
  alpha: 0.1
  source_strength: 1.0
  beta: 0.01
  local_cooling: 0.1

agents:
  max_velocity: 1.0
  max_acceleration: 0.5
  max_angular_velocity: 0.785
  max_angular_acceleration: 0.393
  dt_agent: 0.1
  agent_radius: 0.5
  min_kernel_val: 0.01

sensor:
  fov_degrees: 120.0
  fov_depth: 8.0

multi_agent:
  sensing_range: 10.0
  min_safe_distance: 1.0

map:
  size: [30, 30]
  resolution: 1.0

goal_density:
  type: "gaussian_mixture"
  num_peaks: 2

visualization:
  plot_frequency: 0
  save_video: false

output:
  save_results: false
  verbose: true
  print_frequency: 50
